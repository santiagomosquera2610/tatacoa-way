<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Rendimiento (1.3). Precarga de la foto principal (LCP) solo en la portada, para no
         gastar datos en /admin ni en /resena. -->
    <script>
      if (location.pathname === '/') {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.type = 'image/webp';
        l.setAttribute('imagesrcset', '/img/atardecer-tatacoa-480.webp 480w, /img/atardecer-tatacoa-800.webp 800w, /img/atardecer-tatacoa-1200.webp 1200w');
        l.setAttribute('imagesizes', '(max-width: 448px) 100vw, 448px');
        l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      }
    </script>
    <!-- Fuente Outfit sin bloquear el primer dibujo: se pide en paralelo y,
         mientras llega, el texto se ve con la fuente del sistema (swap). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" /></noscript>
    <title>Tatacoa Way · Desierto de la Tatacoa</title>
    <meta name="description" content="Información turística del Desierto de la Tatacoa (Villavieja, Huila): directorio de prestadores locales, mapa con rutas y contenido verificado. Proyecto sin ánimo de lucro del semillero Quantum – FET." />
  </head>
